# Proxy perimetral de TiendaIA (Laboratorio 5): único punto de entrada.
# Se monta en el contenedor "web" (nginx:1.27-alpine) como
# /etc/nginx/conf.d/default.conf
# Ese archivo se incluye DENTRO del bloque http {} de la configuración principal
# de Nginx; por eso aquí pueden ir limit_req_zone y server_tokens.
# Funciones: 1) sirve el cliente web; 2) reenvía /api/ y /health al gateway;
# 3) limita peticiones por IP; 4) bloquea rutas internas; 5) agrega cabeceras.
# ------------------------------------------------------------ Límite de peticiones
# Zona "api" en memoria compartida (10 MB, unas 160 000 IP). La llave es la IP
# del cliente en binario ($binary_remote_addr, ocupa menos que el texto).
# rate=10r/s: cada IP puede hacer en promedio 10 peticiones por segundo.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Código que se responde al exceder el límite (por omisión sería 503).
limit_req_status 429;
# No revelar la versión de Nginx en la cabecera Server ni en las páginas de error:
# un atacante buscaría vulnerabilidades conocidas de esa versión exacta.
server_tokens off;
server {
listen 80; # dentro del contenedor; Compose publica 8081:80
server_name _; # "_" = cualquier nombre de host
# Tamaño máximo del cuerpo: 6 MB (las imágenes de productos llegan a 5 MB).
# Más grande se rechaza con 413 antes de llegar al gateway.
client_max_body_size 6m;
# DNS interno de Docker (127.0.0.11). Junto con las variables $gateway y $s3
# hace que Nginx busque la IP del servicio en cada petición: arranca aunque
# el gateway todavía no exista y sigue funcionando si el gateway se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;
set $gateway http://gateway:8000;
set $s3 http://seaweedfs:8333;
# -------------------------------------------------------- Cabeceras de seguridad
# always = también en respuestas de error (403, 404, 429...).
# nosniff: el navegador no "adivina" el tipo de archivo (evita ejecutar
# como script algo que se subió como imagen).
add_header X-Content-Type-Options "nosniff" always;
# DENY: ninguna otra página puede mostrar TiendaIA dentro de un <iframe>
# (protege contra clickjacking: botones invisibles encima de los nuestros).
add_header X-Frame-Options "DENY" always;
# Al seguir un enlace a otro sitio solo se envía el origen, no la ruta completa.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# -------------------------------------------------------- Cliente web (estático)
root /usr/share/nginx/html; # carpeta frontend/ montada en solo lectura
index index.html;
location / {
try_files $uri $uri/ =404; # si el archivo no existe: 404 (no lista carpetas)
}
# -------------------------------------------------------- API (al gateway)
location /api/ {
# burst=20: hasta 20 peticiones de más esperan en una fila y se atienden
# al ritmo de 10 por segundo (el panel pide varias cosas a la vez; un
# script que pide una tras otra solo se vuelve más lento). Si la fila
# está llena, la petición recibe 429 de inmediato.
limit_req zone=api burst=20;
proxy_pass $gateway; # sin ruta: se reenvía la URI original (/api/...)
# El gateway ve la IP real del cliente en estas cabeceras (no la de Nginx)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s; # entrenar el modelo puede tardar
}
# Estado de los servicios (lo usa el cliente web); sin límite de peticiones.
location = /health {
proxy_pass $gateway;
proxy_set_header Host $host;
}
# -------------------------------------------------------- Imágenes (URL prefirmadas)
# El navegador descarga las imágenes con URL prefirmadas por el servicio
# Imágenes (S3_PUBLIC_ENDPOINT=http://localhost:8081). La firma incluye el
# host, por eso se reenvía el mismo Host que escribió el navegador.
location /tiendaia-imagenes/ {
limit_except GET HEAD { # solo descargar: subir o borrar se niega (403)
deny all;
}
proxy_pass $s3;
proxy_set_header Host $http_host;
}
# -------------------------------------------------------- Rutas bloqueadas
# Documentación automática de FastAPI: describe toda la API a un atacante.
location ~ ^/(docs|redoc|openapi\.json) {
return 403;
}
# Archivos y carpetas ocultos (.env, .git, .htpasswd...): nunca se sirven.
location ~ /\. {
deny all; # 403 Forbidden
}
}