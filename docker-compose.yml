# TiendaIA - Laboratorio 5 (Parte E: segmentación de redes y proxy perimetral)
x-servicio: &servicio
  restart: unless-stopped
  build: &construir
    context: .

services:
# ------------------------------ Perímetro
# Nginx: sirve el cliente web y es la única puerta hacia la API.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      # Configuración del proxy perimetral; reemplaza la de fábrica de Nginx
      - ./perimetro/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8081:80"]          # ÚNICO puerto abierto a la red
    networks: [publica]         # NO está en "interna": no ve bases de datos
    depends_on: [gateway]

  gateway:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: gateway}}
    # Se borró ports: ["8080:8000"]: ya solo se llega por Nginx.
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on: [clientes, productos, ventas, ia, rabbitmq, imagenes]
    networks: [publica, interna]   # puente entre el perímetro y los servicios

# ------------------------------ Bases de datos
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
    networks: [interna]

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
    networks: [interna]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [interna]

# ------------------------------ Broker de mensajes
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    # El panel 15672 queda solo en 127.0.0.1 (esta máquina). Docker no publica
    # puertos de una red "internal", por eso se agrega la red "gestion".
    ports: ["127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    networks: [interna, gestion]

# ------------------------------ Microservicios
  clientes:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: clientes}}
    environment:
      DATABASE_URL: mysql+pymysql://tienda:${MYSQL_PASSWORD}@mysql:3306/tienda
    depends_on: {mysql: {condition: service_healthy}}
    networks: [interna]

  productos:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: productos}}
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on: {mongo: {condition: service_healthy}}
    networks: [interna]

  ventas:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ventas}}
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    depends_on: [redis, clientes, productos, rabbitmq]
    networks: [interna]

  ia:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_service}}
    environment:
      VENTAS_URL: http://ventas:8000
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    volumes: [modelos:/modelos]
    depends_on: [ventas, rabbitmq]
    networks: [interna]

  notificaciones:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: notificaciones}}
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    depends_on: {rabbitmq: {condition: service_healthy}}
    networks: [interna]

  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    # -volume.max: máximo de volúmenes; -master.volumeSizeLimitMB: tamaño de
    # cada volumen; -s3.config: archivo con identidades (llaves) y permisos.
    # ">-" une las líneas siguientes en una sola (mismo comando, solo más legible).
    command: >-
      server -dir=/data -volume.max=100 -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    # Antes: ports: ["8333:8333"] (abierto a toda la red). Ahora solo desde esta
    # máquina, para los scripts de administración (crear_buckets.py).
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweed_data:/data
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro # :ro = solo lectura
    # "publica": Nginx le reenvía las descargas de imágenes (/tiendaia-imagenes/)
    networks: [interna, publica]

  # Microservicio Imágenes: sube y borra objetos y firma URL de descarga.
  imagenes:
    <<: *servicio # restart común a todos
    build: {<<: *construir, args: {SERVICIO: imagenes}}
    environment:
      - ALMACEN=azure
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - AZURE_PUBLIC_ENDPOINT=http://localhost:10000/devstoreaccount1
      - AZURE_CONTAINER_NAME=bench-contenedor
      - S3_ENDPOINT=http://seaweedfs:8333
      # Las URL prefirmadas ahora apuntan a Nginx, que reenvía a SeaweedFS
      - S3_PUBLIC_ENDPOINT=http://localhost:8081
      - S3_BUCKET=tiendaia-imagenes
      - S3_ACCESS_KEY=${S3_ADMIN_KEY}
      - S3_SECRET_KEY=${S3_ADMIN_SECRET}
    # Orden de arranque: Azurite, S3 y Productos
    depends_on: [azurite, seaweedfs, productos]
    networks: [interna]

  worker:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_service}}
    command: ["python", "worker.py"]
    environment:
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RETARDO_MS: "200"
    volumes: [modelos:/modelos]
    depends_on: {rabbitmq: {condition: service_healthy}}
    networks: [interna]

  ia_listener:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_listener}}
    command: ["python", "listener.py"]
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      IA_URL: "http://ia:8000"
    depends_on: {rabbitmq: {condition: service_healthy}}
    networks: [interna]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0
    # Antes: "10000:10000" (abierto a toda la red). Ahora solo desde esta máquina;
    # "gestion" permite publicar el puerto (la red "interna" no puede).
    ports:
      - "127.0.0.1:10000:10000"
    networks: [interna, gestion]

# ------------------------------ Volúmenes
volumes:
  mysql_data:
  mongo_data:
  redis_data:
  modelos:
  seaweed_data:

# ------------------------------ Redes
networks:
  publica: {}            # red normal (bridge): permite publicar puertos
  interna:
    internal: true       # sin salida a Internet ni puertos publicados
  gestion: {}            # solo para publicar paneles locales en 127.0.0.1